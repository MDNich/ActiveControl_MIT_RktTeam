
# The OpenRocket build version
build.version=24.12.RC.01

# The copyright year for the build. Displayed in the about dialog.
# Will show as Copyright 2013-${build.copyright}
build.copyright=2025

# The source of the package.  When building a package for a specific
# distribution (Debian, Fedora etc.), this should be changed appropriately!
# This is included in bug reports to identify the source of the software.

build.source=default


# Whether checking for updates is enabled by default.
build.checkupdates=true

# Whether checking for beta updates is enabled by default.
build.checkbetaupdates=true

# MIT edition update metadata.  This is intentionally separate from the
# upstream OpenRocket build.version.
build.mit.edition=true
build.mit.version=6.1
build.mit.updateurl=https://api.github.com/repos/MDNich/ActiveControl_MIT_RktTeam/releases/latest
