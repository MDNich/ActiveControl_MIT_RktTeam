plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
    id 'checkstyle'
    id 'org.javamodularity.moduleplugin' version '1.8.15'
    id 'application'
}

// Java settings
java {
    // Must be disabled in order to use the gradle-modules-plugin
    modularity.inferModulePath = false
}

application {
    mainModule = 'info.openrocket.swing'
    mainClass = 'info.openrocket.swing.startup.OpenRocket'

    /*applicationDefaultJvmArgs = [
            // Use the system appearance on macOS for the FlatLaf title bar
            '-Dapple.awt.application.appearance=system',
            // Fix JOGL 3D importing on Windows
            '--add-exports',
            'java.base/java.lang=ALL-UNNAMED',
            '--add-exports',
            'java.desktop/sun.awt=ALL-UNNAMED',
            '--add-exports',
            'java.desktop/sun.java2d=ALL-UNNAMED',
            // Fix Windows window ghosting (issue #1667),
            '-Dsun.java2d.noddraw=true',
            '-Dsun.java2d.d3d=false',
            '-Dsun.java2d.ddforcevram=true',
            '-Dsun.java2d.ddblit=false',
            '-Dswing.useflipBufferStrategy=True'
    ]*/
}

// Fetch the build version from the build.properties file
def buildProperties = new Properties()
file('core/src/main/resources/build.properties').withInputStream { buildProperties.load(it) }
group = 'info.openrocket'
version = buildProperties['build.version']

// Common project configuration
allprojects {
    repositories {
        mavenCentral()
        maven { url = "https://jitpack.io" }
        maven { url = "https://jogamp.org/deployment/maven/" }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: "org.javamodularity.moduleplugin"

    // Configure the gradle-modules-plugin
    modularity {
        standardJavaRelease(17) // For targeting Java 17
        modularity.patchModule("java.scripting", "script-api-1.0.jar")
    }

    test {
        useJUnitPlatform()

        testLogging {
            events 'PASSED', 'FAILED', 'SKIPPED', 'STANDARD_OUT'
            exceptionFormat = 'full'
            showStackTraces = true
            stackTraceFilters = []
        }
    }

    // Common dependencies
    dependencies {
        implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.2'

        testImplementation group: 'org.junit.platform', name: 'junit-platform-runner', version: '1.10.2'
        testImplementation group: 'org.junit.platform', name: 'junit-platform-launcher', version: '1.10.2'
        testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.10.0'
        testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.10.0'
        testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '5.10.0'
        testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.10.0'
        testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: '5.10.0'
    }
}

//tasks.register('serializeEngines') {
//    dependsOn ':core:serializeEngines'
//}

// JAR config
jar {
    archiveBaseName.set('OpenRocket')

    manifest {
        attributes (
            'Description': 'Model-rocketry aerodynamics and trajectory simulation software',
            'SplashScreen-Image': 'pix/splashscreen.png',

            // Versioning
            'Implementation-Version': buildProperties['build.mit.edition'] == 'true'
                    ? buildProperties['build.mit.version'] : buildProperties['build.version'],

            // Vendor Details
            'Implementation-Vendor': 'OpenRocket',
            'Implementation-Vendor-Id': 'info.openrocket',
            'Implementation-URL': 'https://openrocket.info/',
        )
    }
}

// Project dependencies
dependencies {
    implementation(project(path: ":core", configuration: "default"))
    implementation(project(path: ":swing", configuration: "default"))
}

// The root project has no application classes of its own. Keep its thin JAR
// away from the compatibility filename used by existing desktop launchers.
jar {
    archiveClassifier.set('plain')
}

shadowJar {
    from('swing/lib/GLUEGEN-LICENSE.txt') { into 'META-INF/licenses' }
    def mitEdition = buildProperties['build.mit.edition'] == 'true'
    archiveBaseName.set(mitEdition ? 'OpenRocket-MIT' : 'OpenRocket')
    archiveVersion.set(mitEdition ? buildProperties['build.mit.version'] : buildProperties['build.version'])
    archiveClassifier.set('')
    dependsOn(distTar, distZip)

    manifest {
        from jar.manifest
        attributes(
                'Description': 'Model-rocketry aerodynamics and trajectory simulation software',
                'SplashScreen-Image': 'pix/splashscreen.png',
                'Implementation-Version': mitEdition ? buildProperties['build.mit.version'] : buildProperties['build.version'],
                'OpenRocket-Upstream-Version': buildProperties['build.version'],
                'Implementation-Vendor': 'OpenRocket',
                'Implementation-Vendor-Id': 'info.openrocket',
                'Implementation-URL': 'https://openrocket.info/',
                'Add-Exports': 'java.base/java.lang=ALL-UNNAMED java.desktop/sun.awt=ALL-UNNAMED java.desktop/sun.java2d=ALL-UNNAMED',
                'JVM-Args': '-Dapple.awt.application.appearance=system -Dsun.java2d.noddraw=true -Dsun.java2d.d3d=false -Dsun.java2d.ddforcevram=true -Dsun.java2d.ddblit=false -Dswing.useflipBufferStrategy=True'
        )
    }
}

// Existing MIT desktop installations link to the upstream-named shadow JAR.
// Publish that alias atomically so a rebuild never leaves a partial launcher target.
def launcherJar = tasks.register('launcherJar') {
    dependsOn tasks.named('shadowJar')
    def sourceJar = tasks.named('shadowJar').flatMap { it.archiveFile }
    def targetJar = layout.buildDirectory.file("libs/OpenRocket-${buildProperties['build.version']}.jar")
    inputs.file(sourceJar)
    outputs.file(targetJar)
    doLast {
        def source = sourceJar.get().asFile.toPath()
        def target = targetJar.get().asFile.toPath()
        if (source != target) {
            new java.util.jar.JarFile(source.toFile()).withCloseable { jarFile ->
                if (jarFile.getJarEntry('info/openrocket/swing/startup/OpenRocket.class') == null) {
                    throw new GradleException('Refusing to publish a launcher JAR without the startup class')
                }
            }
            def temporary = target.resolveSibling(target.fileName.toString() + '.tmp')
            java.nio.file.Files.copy(source, temporary, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            java.nio.file.Files.move(temporary, target, java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
tasks.named('shadowJar') { finalizedBy launcherJar }

// Package the application for distribution.
tasks.register('dist') {
    group = 'info.openrocket'
    dependsOn 'shadowJar'
    doLast {
        println "Completed the deployable jar in './build/libs"
    }
}
